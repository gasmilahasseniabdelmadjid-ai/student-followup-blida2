name: Build Direct APK
on:
  workflow_dispatch:
  push:
    paths:
      - '**'
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Download PDF fonts and official university logo
        working-directory: .
        run: |
          mkdir -p public/fonts
          curl -L --fail -o public/fonts/NotoNaskhArabic-Regular.ttf https://raw.githubusercontent.com/jenskutilek/free-fonts/master/Noto/Noto%20Naskh%20Arabic/TTF/NotoNaskhArabic-Regular.ttf
          curl -L --fail -o public/fonts/NotoNaskhArabic-Bold.ttf https://raw.githubusercontent.com/jenskutilek/free-fonts/master/Noto/Noto%20Naskh%20Arabic/TTF/NotoNaskhArabic-Bold.ttf
          curl -L --fail -o public/logo.png 'https://elearning.univ-blida2.dz/pluginfile.php?file=%2F1%2Ftheme_academi%2Flogo%2F1766305366%2Flogo.png'
          file public/logo.png
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run validate
      - name: Build web
        run: npm run build
      - name: Add Android
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Prepare Android
        run: python3 scripts/prepare-platforms.py
      - name: Build debug APK for direct installation
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Verify debug APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: student-followup-blida2-v3.4.0-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
