name: Build Direct APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build-direct-apk.yml'
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check source archive
        run: test -f project.zip
      - name: Extract project archive
        run: |
          rm -rf v3-crossplatform
          unzip -q project.zip
          test -f v3-crossplatform/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install dependencies
        working-directory: v3-crossplatform
        run: npm install --no-audit --no-fund
      - name: Build web app
        working-directory: v3-crossplatform
        run: npm run build
      - name: Add Android platform
        working-directory: v3-crossplatform
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: v3-crossplatform
        run: npx cap sync android
      - name: Prepare Android
        working-directory: v3-crossplatform
        run: python3 scripts/prepare-platforms.py
      - name: Configure release signing
        working-directory: v3-crossplatform
        env:
          SFC_KEYSTORE_B64: ${{ secrets.SFC_KEYSTORE_B64 }}
          SFC_KEY_ALIAS: ${{ secrets.SFC_KEY_ALIAS }}
          SFC_KEYSTORE_PASSWORD: ${{ secrets.SFC_KEYSTORE_PASSWORD }}
          SFC_KEY_PASSWORD: ${{ secrets.SFC_KEY_PASSWORD }}
        run: |
          test -n "$SFC_KEYSTORE_B64"
          test -n "$SFC_KEY_ALIAS"
          test -n "$SFC_KEYSTORE_PASSWORD"
          test -n "$SFC_KEY_PASSWORD"
          printf '%s' "$SFC_KEYSTORE_B64" | base64 --decode > release.keystore
          export SFC_KEYSTORE_PATH="$PWD/release.keystore"
          python3 scripts/configure-release-signing.py
      - name: Build release APK
        working-directory: v3-crossplatform/android
        run: ./gradlew clean assembleRelease
      - name: Verify APK
        working-directory: v3-crossplatform
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee SHA256SUMS.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-followup-blida2-v3.0.0-apk
          path: |
            v3-crossplatform/android/app/build/outputs/apk/release/app-release.apk
            v3-crossplatform/SHA256SUMS.txt