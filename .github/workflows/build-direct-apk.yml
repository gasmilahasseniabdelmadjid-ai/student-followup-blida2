name: Build Direct APK
on:
  workflow_dispatch:
  push:
    paths:
      - '**'
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Download PDF fonts
        working-directory: .
        run: |
          mkdir -p public/fonts
          curl -L --fail -o public/fonts/NotoNaskhArabic-Regular.ttf https://raw.githubusercontent.com/jenskutilek/free-fonts/master/Noto/Noto%20Naskh%20Arabic/TTF/NotoNaskhArabic-Regular.ttf
          curl -L --fail -o public/fonts/NotoNaskhArabic-Bold.ttf https://raw.githubusercontent.com/jenskutilek/free-fonts/master/Noto/Noto%20Naskh%20Arabic/TTF/NotoNaskhArabic-Bold.ttf
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run validate
      - name: Build web
        run: npm run build
      - name: Add Android
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Prepare Android
        run: python3 scripts/prepare-platforms.py
      - name: Configure production release signing
        env:
          SFC_KEYSTORE_B64: ${{ secrets.SFC_KEYSTORE_B64 }}
          SFC_KEY_ALIAS: ${{ secrets.SFC_KEY_ALIAS }}
          SFC_KEYSTORE_PASSWORD: ${{ secrets.SFC_KEYSTORE_PASSWORD }}
          SFC_KEY_PASSWORD: ${{ secrets.SFC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SFC_KEYSTORE_B64 SFC_KEY_ALIAS SFC_KEYSTORE_PASSWORD SFC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing production signing secret: $name"
              missing=1
            else
              echo "Secret present: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Production signing secrets must be configured in the release environment."
            exit 1
          fi

          printf '%s' "$SFC_KEYSTORE_B64" | tr -d '\\r\\n ' | base64 --decode > release-source.keystore
          test -s release-source.keystore

          keytool -list -keystore release-source.keystore \
            -storepass "$SFC_KEYSTORE_PASSWORD" \
            -alias "$SFC_KEY_ALIAS" >/tmp/keytool-check.txt 2>&1 || {
              echo "::error::Cannot open the configured keystore with the supplied alias/password."
              cat /tmp/keytool-check.txt
              exit 1
            }

          rm -f release.keystore
          keytool -importkeystore -noprompt \
            -srckeystore release-source.keystore \
            -srcstorepass "$SFC_KEYSTORE_PASSWORD" \
            -srcalias "$SFC_KEY_ALIAS" \
            -srckeypass "$SFC_KEY_PASSWORD" \
            -destkeystore release.keystore \
            -deststoretype PKCS12 \
            -deststorepass "$SFC_KEYSTORE_PASSWORD" \
            -destalias "$SFC_KEY_ALIAS" \
            -destkeypass "$SFC_KEY_PASSWORD"

          export SFC_KEYSTORE_PATH="$PWD/release.keystore"
          python3 scripts/configure-release-signing.py

      - name: Build release APK
        working-directory: android
        run: ./gradlew clean assembleRelease
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: student-followup-blida2-v3.0.0-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            SHA256SUMS.txt
