<!doctype html><html lang="{{get_lang()}}" dir="{{t('dir')}}"><head><meta charset="utf-8"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><title>{{t('admin_title')}}</title></head><body><main class="container"><section class="card"><div class="section-head"><h1>{{t('admin_title')}}</h1><a class="secondary btn" href="{{url_for('export_csv')}}">{{t('export')}}</a></div><table><tr><th>{{t('receipt')}}</th><th>{{t('name_col')}}</th><th>{{t('pub_count')}}</th><th>{{t('date')}}</th></tr>{% for r in rows %}<tr><td><a href="{{url_for('receipt',code=r.receipt_code)}}">{{r.receipt_code}}</a></td><td>{{r.arabic_name}}</td><td>{{r.publication_count}}</td><td>{{r.submitted_at}}</td></tr>{% endfor %}</table></section></main></body></html>
