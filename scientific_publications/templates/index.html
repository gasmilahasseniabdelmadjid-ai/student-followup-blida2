<!doctype html><html lang="{{get_lang()}}" dir="{{t('dir')}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{t('title')}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header class="hero"><div class="lang-switch"><a href="{{lang_url('ar')}}">العربية</a><a href="{{lang_url('fr')}}">Français</a><a href="{{lang_url('en')}}">English</a></div><div class="brand"><img src="{{url_for('static',filename='university-logo.jpg')}}" class="univ-logo"><div><h1>{{t('university')}}</h1><p>{{t('vice')}}</p><p>{{t('platform')}}</p></div></div></header><main class="container"><section class="card"><h2>{{t('survey')}}</h2><p>{{t('intro')}}</p><div class="notice">{{t('notice')}}</div></section><form class="card" method="post" action="{{url_for('submit')}}" id="surveyForm" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><h2>{{t('general')}}</h2><div class="grid"><label>{{t('arabic_name')}} *<input name="arabic_name" required></label><label>{{t('english_name')}} *<input name="english_name" required></label><label>{{t('rank')}} *<select name="rank" required><option value="">{{t('choose')}}</option>{% for r in ranks %}<option value="{{r}}">{{lang_label(RANK_LABELS[r])}}</option>{% endfor %}</select></label><label>{{t('faculty')}} *<input name="faculty" required></label><label>{{t('department')}} *<input name="department" required></label><label>{{t('specialization')}} *<input name="specialization" required></label><label class="full">{{t('laboratory')}} *<input name="laboratory" required></label></div><div class="section-head"><h2>{{t('publications_section')}}</h2><div class="publication-actions"><button type="button" class="secondary" onclick="addPublication('article')">+ {{t('add_article')}}</button><button type="button" class="book-btn" onclick="addPublication('book')">+ {{t('add_book')}}</button></div></div><div id="articles"></div><div class="actions"><button class="primary" type="submit">{{t('submit')}}</button><button class="ghost" type="reset" onclick="resetPublications()">{{t('clear')}}</button></div></form></main><footer>{{t('footer')}}</footer><template id="publicationTemplate"><article class="article card-inner"><div class="section-head"><div><h3>{{t('publication')}} #<span class="num"></span></h3><p class="muted type-hint">{{t('select_type_hint')}}</p></div><button type="button" class="remove" onclick="this.closest('.article').remove();renumber()">{{t('delete')}}</button></div><label>{{t('publication_type')}} *<select class="pubtype" name="publication_type[]" required onchange="toggleType(this)"><option value="article">{{t('article_type')}}</option><option value="book">{{t('book_type')}}</option></select></label><div class="article-fields"><div class="grid"><label class="full">{{t('article_title')}} *<textarea name="article_title[]" required></textarea></label><label class="full">{{t('article_title_en')}} *<textarea name="article_title_en[]" required></textarea></label><label>{{t('journal')}} *<input name="journal_name[]" required></label><label>{{t('classification')}} *<select name="classification[]" required>{% for c in classifications %}<option value="{{c}}">{{lang_label(CLASS_LABELS[c])}}</option>{% endfor %}</select></label><label>{{t('year')}} *<input type="number" name="publication_year[]" min="1900" max="2100" required></label><label class="full">{{t('databases')}}<select class="database-select" multiple size="4">{% for d in databases %}<option value="{{d}}">{{lang_label(DB_LABELS[d])}}</option>{% endfor %}</select><input type="hidden" name="databases_json[]" class="database-json"><small>{{t('multi_hint')}}</small></label><label>{{t('article_url')}}<input type="url" name="article_url[]"></label><label>{{t('scholar_url')}}<input type="url" name="scholar_url[]"></label></div></div><div class="book-fields" style="display:none"><div class="grid"><label class="full">{{t('book_title')}} *<input name="book_title[]" disabled></label><label>{{t('book_kind')}} *<select name="book_type[]" disabled><option value="">{{t('choose')}}</option><option value="علمي">{{t('scientific')}}</option><option value="بيداغوجي">{{t('pedagogical')}}</option></select></label><label>{{t('publisher')}} *<input name="publisher[]" disabled></label><label>{{t('book_year')}} *<input type="number" name="book_year[]" min="1900" max="2100" disabled></label><label class="full">{{t('excerpt_url')}}<input type="url" name="excerpt_url[]" disabled></label><label class="full">{{t('cover')}} *<input type="file" name="cover[]" accept="image/png,image/jpeg,image/webp"><small>{{t('cover_hint')}}</small></label></div></div></article></template><script>const box=document.getElementById('articles'),tpl=document.getElementById('publicationTemplate'),form=document.getElementById('surveyForm');function addPublication(initialType="article"){box.appendChild(tpl.content.cloneNode(true));const a=box.lastElementChild;const sel=a.querySelector(".pubtype");sel.value=initialType;toggleType(sel);renumber()}function renumber(){[...box.querySelectorAll('.article')].forEach((a,i)=>a.querySelector('.num').textContent=i+1)}function resetPublications(){setTimeout(()=>{box.innerHTML='';addPublication("article")},0)}function toggleType(s){const c=s.closest('.article'),b=s.value==='book';c.querySelector('.article-fields').style.display=b?'none':'block';c.querySelector('.book-fields').style.display=b?'block':'none';c.querySelectorAll('.article-fields input,.article-fields textarea,.article-fields select').forEach(x=>x.disabled=b);c.querySelectorAll('.book-fields input:not([type="file"]),.book-fields select').forEach(x=>x.disabled=!b);c.querySelectorAll('.article-fields [required]').forEach(x=>x.required=!b);c.querySelectorAll('.book-fields [required]').forEach(x=>x.required=b)}form.addEventListener('submit',()=>box.querySelectorAll('.article').forEach(a=>a.querySelector('.database-json').value=JSON.stringify([...a.querySelectorAll('.database-select option:checked')].map(o=>o.value))));addPublication();</script></body></html>
