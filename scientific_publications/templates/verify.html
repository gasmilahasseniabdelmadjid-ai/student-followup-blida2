<!doctype html><html lang="{{get_lang()}}" dir="{{t('dir')}}"><head><meta charset="utf-8"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><title>{{t('verification')}}</title></head><body><main class="container narrow"><section class="card">{% if submission %}<h1>{{t('verified')}}</h1><p>{{t('code')}}: <b>{{code}}</b></p><p>{{t('name')}}: {{submission.arabic_name}}</p><p>{{t('count')}}: {{publications|length}}</p><p>{{t('submitted')}}: {{submission.submitted_at}}</p>{% else %}<h1>{{t('verify_fail')}}</h1><p>{{t('not_registered')}}</p>{% endif %}</section></main></body></html>
